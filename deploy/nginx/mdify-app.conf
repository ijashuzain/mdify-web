# Shared app routing for every mdify server block. Installed to /etc/nginx/snippets/mdify-app.conf.
root /opt/mdify/www;
index index.html;
client_max_body_size 1m;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://cdnjs.buymeacoffee.com; connect-src 'self' https://*.buymeacoffee.com; frame-src https://www.buymeacoffee.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location /api/ {
    proxy_pass http://127.0.0.1:8017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /django-static/ {
    alias /opt/mdify/staticfiles/;
    expires 30d;
    access_log off;
}

location /assets/ {
    expires max;
    access_log off;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri /index.html;
}
