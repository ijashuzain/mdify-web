# Old mdify hostnames: serve the handoff page that forwards visitors (and their
# browser data) to the primary domain. Installed to /etc/nginx/snippets/mdify-handoff.conf.
root /opt/mdify/handoff;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Robots-Tag noindex always;

location = /handoff.js {
    expires 1h;
}

location / {
    expires -1;
    try_files /index.html =404;
}
