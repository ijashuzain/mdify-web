name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mdify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend
        working-directory: backend
        env:
          DEBUG: "True"
        run: |
          pip install --quiet -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Sync and deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PROXY_SECRET: ${{ secrets.MDIFY_PROXY_SECRET }}
          APP_DIR: /opt/mdify/app
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/vps_key -o IdentitiesOnly=yes"

          $SSH "$VPS_USER@$VPS_HOST" "install -d -m 755 $APP_DIR"
          rsync -az --delete \
            --include 'frontend/' --include 'frontend/dist/***' --include 'frontend/handoff/***' --exclude 'frontend/*' \
            --exclude '.git' --exclude '.github' --exclude 'docs' \
            --exclude 'backend/.venv' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude 'backend/db.sqlite3' --exclude 'backend/.cache' --exclude 'backend/staticfiles' \
            -e "$SSH" ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"
          # The proxy secret travels over SSH stdin so it never appears in logs or argv.
          printf '%s\n' "$PROXY_SECRET" | $SSH "$VPS_USER@$VPS_HOST" \
            "IFS= read -r PROXY_SECRET_IN; export PROXY_SECRET_IN; bash $APP_DIR/deploy/deploy_mdify.sh"

      - name: Deploy redirect page to Cloudflare Pages
        # mdifyapp.pages.dev now only forwards visitors to the primary domain.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'mdifyapp' }}
        working-directory: frontend/handoff
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping Pages deploy."
            exit 0
          fi
          # Only redirect once the new domain answers over HTTPS.
          curl -fsS --max-time 15 https://mdify.is-live.dev/api/health/ >/dev/null || {
            echo "mdify.is-live.dev is not serving HTTPS yet; leaving Pages unchanged." >&2
            exit 1
          }
          npx --yes wrangler@4 pages deploy . --project-name "$PROJECT" --branch main --commit-dirty=true
